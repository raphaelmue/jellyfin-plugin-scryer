name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - run: dotnet build -c Release

      - name: Validate both server builds
        run: |
          dotnet run --project tests/Scryer.Plugin.SelfTest -c Release -f net9.0
          dotnet run --project tests/Scryer.Plugin.SelfTest -c Release -f net10.0 --no-restore
          node --test Web/tests/scryer-browser-lifecycle.test.js Web/tests/scryer-runtime.test.js
          git diff --check

      - name: Package both plugin ABIs
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/package-release.py --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          files: |
            dist/*.zip
            dist/manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Catalog publication handoff
        run: |
          echo 'Download the release manifest, verify both archive checksums, and publish it to main with a signed commit.' >> "$GITHUB_STEP_SUMMARY"
